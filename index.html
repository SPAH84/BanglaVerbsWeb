<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Bangla Verbs</title>
    
    <!-- iOS Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Bangla Verbs">
    <meta name="referrer" content="no-referrer">
    <link rel="apple-touch-icon" href="assets/icons/icon.jpg">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Noto+Serif+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css?v=32">
</head>
<body class="dark-mode">
    <!-- App Container -->
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-top">
                <h1>Bangla Verbs</h1>
                <span id="app-version" style="font-size:11px;font-weight:700;color:var(--text-muted);letter-spacing:0.5px;opacity:0.7;align-self:center;">v32</span>
                <button id="theme-toggle" class="header-action-btn" aria-label="Toggle Theme">
                    <svg class="sun-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m2.828-9.9a5 5 0 11-7.07 7.07 5 5 0 017.07-7.07z"></path></svg>
                    <svg class="moon-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                </button>
            </div>
            
            <!-- Tense Selector Bar -->
            <div class="tense-selector-bar">
                <span class="tense-label">Tense:</span>
                <div class="tense-switch-container">
                    <input type="radio" id="tense-ps" name="tense-select" value="present_simple" checked>
                    <label for="tense-ps">Simple</label>
                    
                    <input type="radio" id="tense-pp" name="tense-select" value="present_perfect">
                    <label for="tense-pp">Perfect</label>
                    
                    <span class="tense-switch-slider"></span>
                </div>
            </div>

            <!-- Level / Verb Set Selector Bar -->
            <div class="level-selector-bar">
                <span class="level-label">Level:</span>
                <div class="level-switch-container">
                    <input type="radio" id="level-set1" name="level-select" value="1" checked>
                    <label for="level-set1">Set 1 (19)</label>
                    
                    <input type="radio" id="level-set2" name="level-select" value="2">
                    <label for="level-set2">Set 2 (40)</label>
                    
                    <input type="radio" id="level-all" name="level-select" value="all">
                    <label for="level-all">All (59)</label>
                    
                    <span class="level-switch-slider"></span>
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="app-main-content">
            <!-- Screen 1: Drill Player -->
            <section id="screen-drills" class="app-screen active">
                <div class="player-card">
                    <div class="player-stats">
                        <span id="drill-progress-text">Verb 1 of 19</span>
                        <div class="progress-bar-container">
                            <div id="drill-progress-bar" class="progress-bar"></div>
                        </div>
                    </div>
                    
                    <!-- Verb Subtitle Display -->
                    <div class="drill-display-area">
                        <div id="drill-display-eng" class="drill-eng-word">To do</div>
                        <div id="drill-display-bn-inf" class="drill-bn-inf">করা</div>
                        <div class="drill-conjugation-grid">
                            <div class="drill-conj-item" id="conj-ami">
                                <span class="pronoun">আমি</span>
                                <span class="form" id="drill-val-ami">করি</span>
                            </div>
                            <div class="drill-conj-item" id="conj-tumi">
                                <span class="pronoun">তুমি</span>
                                <span class="form" id="drill-val-tumi">করো</span>
                            </div>
                            <div class="drill-conj-item" id="conj-apni">
                                <span class="pronoun">আপনি</span>
                                <span class="form" id="drill-val-apni">করেন</span>
                            </div>
                            <div class="drill-conj-item" id="conj-se">
                                <span class="pronoun">সে</span>
                                <span class="form" id="drill-val-se">করে</span>
                            </div>
                        </div>
                    </div>

                    <!-- Player Controls -->
                    <div class="player-controls">
                        <button id="btn-prev" class="control-btn" aria-label="Previous Verb">
                            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"></path></svg>
                        </button>
                        
                        <button id="btn-play" class="control-btn play-btn" aria-label="Play or Pause">
                            <!-- Play Icon -->
                            <svg class="play-icon" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M8 5v14l11-7z"></path></svg>
                            <!-- Pause Icon -->
                            <svg class="pause-icon hidden" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"></path></svg>
                        </button>
                        
                        <button id="btn-next" class="control-btn" aria-label="Next Verb">
                            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"></path></svg>
                        </button>
                    </div>
                </div>

                <!-- Player Settings Accordion -->
                <div class="settings-card">
                    <button class="settings-header">
                        <span>Playback Settings</span>
                        <svg class="chevron-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"></path></svg>
                    </button>
                    <div class="settings-content hidden">
                        <!-- Audio Voice Controller -->
                        <div class="voice-selector-bar">
                            <span class="voice-label">Voice:</span>
                            <div class="gender-switch-container">
                                <input type="radio" id="voice-female" name="voice-gender" value="female" checked>
                                <label for="voice-female">Female</label>
                                
                                <input type="radio" id="voice-male" name="voice-gender" value="male">
                                <label for="voice-male">Male</label>
                                
                                <span class="gender-switch-slider"></span>
                            </div>
                        </div>

                        <!-- Speed Control -->
                        <div class="setting-row">
                            <label>Speech Speed</label>
                            <div class="speed-selector">
                                <button class="speed-btn" data-speed="0.8">0.8x</button>
                                <button class="speed-btn active" data-speed="1.0">1.0x</button>
                                <button class="speed-btn" data-speed="1.2">1.2x</button>
                            </div>
                        </div>
                        
                        <!-- Pause Settings -->
                        <div class="setting-row">
                            <label>Recall Pause (s)</label>
                            <input type="range" id="param-pause-recall" min="1.0" max="4.0" step="0.5" value="1.5">
                            <span class="slider-value" id="val-pause-recall">1.5s</span>
                        </div>
                        <div class="setting-row">
                            <label>Repeat Pause (s)</label>
                            <input type="range" id="param-pause-repeat" min="0.5" max="3.0" step="0.5" value="1.0">
                            <span class="slider-value" id="val-pause-repeat">1.0s</span>
                        </div>
                        <div class="setting-row">
                            <label>Verb Gap Pause (s)</label>
                            <input type="range" id="param-pause-gap" min="1.5" max="5.0" step="0.5" value="2.0">
                            <span class="slider-value" id="val-pause-gap">2.0s</span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Screen 2: Conjugation Grid -->
            <section id="screen-grid" class="app-screen">
                <div class="search-bar-container">
                    <input type="search" id="verb-search" placeholder="Search English or Bangla verbs...">
                </div>
                <div id="verbs-list" class="verbs-list-container">
                    <!-- Verb list dynamically populated -->
                </div>
            </section>

            <!-- Screen 3: Interactive Quiz -->
            <section id="screen-quiz" class="app-screen">
                <div class="quiz-card">
                    <!-- Quiz Score Area -->
                    <div class="quiz-progress-header">
                        <span id="quiz-progress-text">Question 1 of 10</span>
                        <span id="quiz-score-text">Score: 0</span>
                    </div>
                    
                    <!-- Question Area -->
                    <div class="quiz-question-container">
                        <div class="quiz-question-title">Translate & Conjugate</div>
                        <div id="quiz-question-prompt" class="quiz-prompt">To go (আমি)</div>
                        <button id="quiz-audio-btn" class="quiz-audio-btn" aria-label="Play Prompt Audio">
                            <svg fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 3v18l-6-6H2V9h4l6-6zm4.5 9c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 4.45v2.06c2.89.86 5 3.54 5 6.49s-2.11 5.63-5 6.49v2.06c3.95-.9 7-4.43 7-8.55s-3.05-7.65-7-8.55z"></path></svg>
                        </button>
                    </div>
                    
                    <!-- Options Container -->
                    <div id="quiz-options-container" class="quiz-options-container">
                        <!-- Dynamic Buttons -->
                    </div>
                    
                    <!-- Next Question Area -->
                    <div class="quiz-footer">
                        <button id="btn-quiz-next" class="quiz-next-btn hidden">Next Question</button>
                    </div>
                </div>
            </section>
        </main>

        <!-- Bottom Navigation Bar -->
        <nav class="app-nav-bar">
            <button class="nav-item active" data-screen="screen-drills">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.348a1.125 1.125 0 010 1.971l-11.54 6.347a1.125 1.125 0 01-1.667-.985V5.653z"></path></svg>
                <span>Drill</span>
            </button>
            <button class="nav-item" data-screen="screen-grid">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 6.75h12M8.25 12h12m-12 5.25h12M3.75 6.75h.007v.008H3.75V6.75zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zM3.75 12h.007v.008H3.75V12zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm-.375 5.25h.007v.008H3.75v-.008zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z"></path></svg>
                <span>Grid</span>
            </button>
            <button class="nav-item" data-screen="screen-quiz">
                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.375M9 18h3.375m-6.75-6h.008v.008H5.625V12zm0 3h.008v.008H5.625V15zm0 3h.008v.008H5.625V18zM12 3h.75a3 3 0 013 3v13.5a3 3 0 01-3 3H5.25a3 3 0 01-3-3V6a3 3 0 013-3H12zm0 0v18"></path></svg>
                <span>Quiz</span>
            </button>
        </nav>
    </div>

    <!-- Custom JavaScript Module -->
    <script type="module" src="js/app.js?v=32"></script>
</body>
</html>
